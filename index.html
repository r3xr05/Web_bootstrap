<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <!--- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap1.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- menu -->
    <div id="menu-container"> </div>

    <div class="container">
        <h3 class="alert alert-success mb-4">หน้าหลัก</h3>
        
        <div class="alert alert-primary text-end" role="alert">
            Nattapong Sumanat
        </div>

        <div class="text-end mb-4">
            <a class="btn btn-info" href="https://www.google.com/"  href="#" role="button">Google</a>
        </div>


    </div> <!--end container-->
    <!-- Grid -->
    <div class="container text-center">
        <div class="row">

            <div class="col-sm-4  bg-primary-subtle">
            <img src="image/1.jpg" width="100%">
            รักแมว 1
            </div>

            <div class="col-sm-4 bg-success-subtle">
            <img src="image/2.jpg" width="110%">
            รักแมว 2
            </div>

            <div class="col-sm-4  bg-warning-subtle">

            <h5 class="mt-4">ลงทะเบียน</h5>

            <form class="text-start">
                <div class="mb-3">
                    <label class="form-label">Firstname</label>
                    <input type="text" class="form-control" id="firstname" required placeholder="input firstname">
                </div>
                <div class="mb-3">
                    <label class="form-label">Lastname</label>
                    <input type="text" class="form-control" id="lastname" required placeholder="input Lastname">
                </div>
                <div class="mb-3">
                    <label class="form-label">Telephone</label>
                    <input type="tel" class="form-control" id="phone" required placeholder="ex. xxx-xxxxxxx">
                </div>
                <div class="mb-3">
                    <label class="form-label">Province</label>
                    <select class="form-select" aria-label="Default select example">
                        <option selected>เลือกจังหวัด</option>
                        <option value="1">ชลบุรี</option>
                        <option value="2">ระยอง</option>
                        <option value="3">เชียงใหม่</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" id="e-mail" required placeholder="input email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="pw" required placeholder="input password">
                </div>
                <div class="text-center mb-4">
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <button type="reset" class="btn btn-secondary">Cancel</button>
                </div>
            </form>

            </div>

        </div>
    </div>


</body>
</html>
